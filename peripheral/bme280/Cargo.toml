[package]
name = "bme280"
version = "0.1.0"
edition = "2024"

[dependencies]
embedded-hal = "1.0.0"
tokio = { version = "1.45.1", features = [ "time" ]}

[dev-dependencies]
embedded-hal-mock = { version = "0.11.1", default-features = false, features = ["eh1"] }
tokio = { version = "1.45.1", features = ["rt", "macros", "time"] }
